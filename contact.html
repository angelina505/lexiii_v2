    <script>
  // Script pour l'ouverture/fermeture du menu déroulant au clic sur Desktop
  const prestationsBtn = document.getElementById('prestations-btn');
  const dropdownLi = prestationsBtn.closest('.dropdown');
  const navLinks = document.querySelector('.nav-links'); // On utilise l'élément parent

  if (prestationsBtn) {
    // 1. Ouvrir/fermer le menu au clic sur "Prestations"
    prestationsBtn.addEventListener('click', (event) => {
      // Empêche le comportement par défaut (aller à '#' et recharger)
      event.preventDefault(); 
      
      // Ferme le menu mobile si par accident il est ouvert (bien que géré par le media query)
      if (window.innerWidth <= 800) return; 

      // Toggle la classe 'open' sur l'élément li.dropdown
      dropdownLi.classList.toggle('open');
      
      // Assurez-vous que le clic n'atteint pas le document immédiatement (propagation)
      event.stopPropagation();
    });

    // 2. Fermer le menu si l'utilisateur clique en dehors (un clic "globale")
    document.addEventListener('click', (event) => {
      // Vérifie si le clic a eu lieu en dehors du conteneur du menu déroulant (.dropdown)
      // et que le menu mobile n'est pas ouvert (car le menu déroulant est caché sur mobile)
      if (!dropdownLi.contains(event.target) && dropdownLi.classList.contains('open') && window.innerWidth > 800) {
        dropdownLi.classList.remove('open');
      }
    });

    // Optionnel : Empêcher la fermeture si l'utilisateur clique *dans* le menu
    // (pour les navigateurs qui pourraient le propager différemment)
    const dropdownMenu = dropdownLi.querySelector('.dropdown-menu');
    dropdownMenu.addEventListener('click', (event) => {
      event.stopPropagation();
      // Le lien continuera vers la page, et le menu se fermera au rechargement.
    });
  }
</script>

<script>
  // Variable globale pour gérer l'état d'animation et le timer des cartes
  let cardsAnimationLaunched = false;
  let cardSequenceTimer = null;

  // --- Fonctions d'aide ---

  // Fonction utilitaire pour vérifier si un élément est dans le viewport
  function isElementInViewport(el) {
    const rect = el.getBoundingClientRect();
    const offset = 100; // Décalage pour démarrer l'animation un peu avant

    return (
      rect.top <= (window.innerHeight - offset || document.documentElement.clientHeight - offset)
    );
  }

  // Fonction pour lancer la séquence séquentielle des cartes (1.2s de décalage)
  function startCardSequence() {
      // S'assurer qu'elle ne se lance qu'une seule fois
      if (cardsAnimationLaunched) return;
      cardsAnimationLaunched = true; 

      const cards = document.querySelectorAll('.card.scroll-anim-card');
      const hoverDuration = 1000; // Durée du "hover" : 1 seconde
      const staggerDelay = 1200;  // Décalage entre chaque carte : 1.2 seconde

      cards.forEach((card, index) => {
          
          const startTime = index * staggerDelay;
          const endTime = startTime + hoverDuration;

          // Lancer l'effet de survol
          setTimeout(() => {
              card.classList.add('card-active');
          }, startTime);

          // Retirer l'effet de survol
          setTimeout(() => {
              card.classList.remove('card-active');
          }, endTime);
      });
  }


  // --- Fonction principale de gestion du Scroll ---

  function handleScrollAnimation() {
    
    // Cible tous les éléments d'animation (pour les pages prestations et accueil)
    const elementsToAnimate = document.querySelectorAll('.scroll-anim, .reveal-left, .scroll-anim-card'); 
    
    // Cible la section des cartes (uniquement pour l'accueil, mais sans erreur ici)
    const cardsSection = document.querySelector('.services');

    elementsToAnimate.forEach((el) => {
      
      // Logique générale d'apparition pour scroll-anim et reveal-left
      if (!el.classList.contains('visible') && isElementInViewport(el)) {
          el.classList.add('visible');
      }
    });

    // Logique spécifique : Lancer l'animation des cartes (si présente)
    // Elle se déclenche quand la section des cartes devient visible et n'a pas été animée.
    if (cardsSection && cardsSection.classList.contains('visible') && !cardsAnimationLaunched) {
      
      // Délai de 100ms pour s'assurer que l'apparition CSS de la section est terminée.
      clearTimeout(cardSequenceTimer);
      cardSequenceTimer = setTimeout(startCardSequence, 100); 
    }
  }

  // --- Écouteurs d'événement ---
  window.addEventListener('scroll', handleScrollAnimation);
  // Exécute la fonction une fois au chargement pour animer les éléments déjà visibles
  window.addEventListener('load', handleScrollAnimation);
  handleScrollAnimation();
</script>
